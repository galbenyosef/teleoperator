<script>(function(){
'use strict';
if(window.mindblown&&window.mindblown.sound)return;
var on=true;
function stored(){try{var m=/(?:^|;\s*)mb_sound=([^;]*)/.exec(document.cookie||'');return !(m&&m[1]==='off');}catch(e){return true;}}
try{on=stored();}catch(e){}

// <audio> and <video>. Every element is remembered: half of them are in no
// document. See the notes above this template.
var media=null;
var seen=[];
try{
  var proto=window.HTMLMediaElement&&HTMLMediaElement.prototype;
  media=proto&&Object.getOwnPropertyDescriptor(proto,'muted');
  if(media&&media.get&&media.set){
    Object.defineProperty(proto,'muted',{configurable:true,enumerable:media.enumerable,
      get:function(){return media.get.call(this);},
      set:function(v){
        if(on){media.set.call(this,v);return;}
        note(this);this.__mbWant=!!v;this.__mbHeld=true;media.set.call(this,true);
      }});
    var play=proto.play;
    if(play){proto.play=function(){note(this);hold(this);return play.apply(this,arguments);};}
  }else{media=null;}
}catch(e){media=null;}
function note(el){
  try{
    if(el.__mbSeen)return;
    el.__mbSeen=true;
    seen.push(typeof WeakRef==='function'?new WeakRef(el):{deref:function(){return el;}});
  }catch(e){}
}
function hold(el){
  if(!media||!el)return;
  try{
    if(on){if(el.__mbHeld){el.__mbHeld=false;media.set.call(el,!!el.__mbWant);}}
    else{if(!el.__mbHeld){el.__mbWant=media.get.call(el);el.__mbHeld=true;}media.set.call(el,true);}
  }catch(e){}
}
function sweep(){
  try{var all=document.querySelectorAll('audio,video');for(var i=0;i<all.length;i++){note(all[i]);hold(all[i]);}}catch(e){}
  for(var j=seen.length-1;j>=0;j--){
    var el=null;
    try{el=seen[j].deref();}catch(e){}
    if(el)hold(el);else seen.splice(j,1);
  }
}
// <audio autoplay> never calls play().
try{document.addEventListener('play',function(e){note(e.target);hold(e.target);},true);}catch(e){}

// Web Audio: a gain node where the destination was, connected to the real one.
var gains=[];
try{
  var base=window.BaseAudioContext||window.AudioContext||window.webkitAudioContext;
  var proto2=base&&base.prototype;
  var dest=proto2&&Object.getOwnPropertyDescriptor(proto2,'destination');
  if(dest&&dest.get){
    Object.defineProperty(proto2,'destination',{configurable:true,enumerable:dest.enumerable,
      get:function(){
        var real=dest.get.call(this);
        try{
          if(window.OfflineAudioContext&&this instanceof OfflineAudioContext)return real;
          if(!this.createGain)return real;
          var g=this.__mbGain;
          if(!g){
            g=this.createGain();
            g.gain.value=on?1:0;
            g.connect(real);
            try{Object.defineProperty(g,'maxChannelCount',{value:real.maxChannelCount});}catch(e){}
            try{Object.defineProperty(this,'__mbGain',{value:g});}catch(e){this.__mbGain=g;}
            gains.push(g);
          }
          return g;
        }catch(e){return real;}
      }});
  }
}catch(e){}
function ramp(g,v){
  try{
    var t=g.context.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value,t);
    g.gain.linearRampToValueAtTime(v,t+0.02);
  }catch(e){try{g.gain.value=v;}catch(e2){}}
}

// Spoken words are a sound too.
try{
  var synth=window.speechSynthesis;
  if(synth&&synth.speak){
    var speak=synth.speak;
    synth.speak=function(){if(!on)return;return speak.apply(synth,arguments);};
  }
}catch(e){}

// The zone: everything after the first label. An address is not a name.
function zone(){
  try{
    var host=location.hostname,at=host.indexOf('.');
    if(at<0)return '';
    var rest=host.slice(at+1);
    if(rest.indexOf('.')<0)return '';
    var last=rest.slice(rest.lastIndexOf('.')+1);
    if(!/^[a-z]{2,}$/.test(last))return '';
    return rest;
  }catch(e){return '';}
}
// Written twice: at once here, and by a response, which Safari does not cap.
function keep(){
  var value=on?'on':'off';
  try{
    var domain=zone();
    document.cookie='mb_sound='+value+';path=/;max-age=31536000;samesite=lax'+
      (location.protocol==='https:'?';secure':'')+(domain?';domain='+domain:'');
  }catch(e){}
  try{fetch('/__mb/sound?on='+(on?'1':'0'),{method:'POST',credentials:'same-origin',keepalive:true}).catch(function(){});}catch(e){}
}
// The other document: the shell holds the panel, the frame holds the page.
// Nobody re-broadcasts and an unchanged value returns early, so no loop.
function tell(){
  var note={type:'mb-sound',on:on};
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(note,location.origin);}catch(e){}
  try{for(var i=0;i<window.frames.length;i++){try{window.frames[i].postMessage(note,location.origin);}catch(e2){}}}catch(e){}
}
function set(next,spread){
  next=!!next;
  if(next===on)return on;
  on=next;
  for(var i=0;i<gains.length;i++)ramp(gains[i],on?1:0);
  sweep();
  if(!on){try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}}
  if(spread){keep();tell();}
  try{window.dispatchEvent(new CustomEvent('mindblown:sound',{detail:{on:on}}));}catch(e){}
  return on;
}
// OURS IS THE ZONE, NOT THE ORIGIN.
//
// This used to answer only its own origin, which was right while the only other
// document was the shell around it -- the shell and the game are the same host.
// The APP frames a game too, from mindblown.ai, and it now carries the sound
// switch in the game's own rail: a control that belongs to whoever is holding
// the phone, on the one surface where they are actually holding it.
//
// The zone is already computed above for the cookie, and it is the same trust
// boundary: everything under mindblown.ai is ours, and a sibling that could
// send this can already read the cookie it writes. What it may set is one
// boolean about audio.
//
// SPREAD:TRUE for a message, unlike the shell's own broadcast below. The app is
// telling us what a PERSON chose, so it is written down and passed on -- the
// next game they open starts muted too, which is the whole point of a switch
// that belongs to them.
function ours(origin){
  try{
    if(origin===location.origin)return true;
    var z=zone();
    if(!z)return false;
    var host=new URL(origin).hostname;
    return host===z||host.slice(-(z.length+1))==='.'+z;
  }catch(e){return false;}
}
try{
  window.addEventListener('message',function(e){
    try{
      if(!ours(e.origin))return;
      var d=e.data;
      if(d&&d.type==='mb-sound'&&typeof d.on==='boolean')set(d.on,e.origin!==location.origin);
    }catch(e2){}
  });
  // A page restored from the back-forward cache reads the setting again.
  window.addEventListener('pageshow',function(){try{set(stored(),false);}catch(e){}});
}catch(e){}

// The page's half of the switch: window.mindblown.sound, defined before the
// page's first line. See the notes above this template for what it is for.
var api={
  get on(){return on;},
  set:function(next){return set(next,true);},
  toggle:function(){return set(!on,true);},
  onchange:function(fn){
    var hear=function(e){try{fn(e.detail.on);}catch(err){}};
    try{window.addEventListener('mindblown:sound',hear);}catch(e){}
    return function(){try{window.removeEventListener('mindblown:sound',hear);}catch(e){}};
  }
};
// MERGED, NEVER ASSIGNED: pod.js puts the game id on this same object.
try{
  window.mindblown=window.mindblown||{};
  window.mindblown.sound=api;
}catch(e){}
if(!on)sweep();
})();</script>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0f0f10;overscroll-behavior:none;}
/* THE FEED IS THE PAGE. The game the link named is the first thing on it and
   the rest of the shelf is under it, one screen each.
   SCROLL-SNAP AND NOT A SCRIPT: the browser does the paging, so a flick lands
   on a game rather than between two, and a slow drag comes back to where it
   started without anything of ours running per frame. */
#mb-feed{position:fixed;inset:0;overflow:hidden;}
.mb-slide{position:relative;width:100%;height:100%;background:#0f0f10;}
/* THE HEIGHT IS COMPUTED, NOT INFERRED FROM top AND bottom. An iframe is a
   REPLACED element: with height:auto it takes its intrinsic 150px and the
   bottom offset is dropped as over-constrained. Written that way this frame was
   150px tall on a 664px screen -- measured, and it looked like a broken game
   rather than a broken rule. */
/* AND IT ENDS ABOVE THE BAR. On a phone the rail is a strip across the bottom,
   and it used to be laid OVER the game: an iframe is a rectangle and takes
   every tap inside it, so that strip owned the bottom of the screen whatever
   the game drew there. Measured on 2d.mindblown.ai, iPhone 13: 96 of 96 hit
   tests in that band answered to the rail and none to the game.
   The rail is in THIS document (spec 38): its bundle measures the bar it draws
   and writes --mb-rail-h on the root, and this is what reads it. UNSET IS
   ZERO, which is a game that fills the window: a desktop, and a build with no
   rail. */
.mb-slide iframe{position:absolute;left:0;top:0;width:100%;
  height:calc(100% - var(--mb-rail-h, 0px));border:0;display:block;}
/* A SLIDE THAT IS NOT LOADED YET is its own name on the shelf. It is not a
   picture: the pictures live on another origin and img-src does not admit it,
   and a feed that widened this page's policy to show a thumbnail would be a
   poor trade. The frame arrives as the slide comes into reach. */
.mb-card{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:24px;
  text-align:center;color:#fff1cf;
  font:600 19px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;}
.mb-card span{font-size:13px;font-weight:500;opacity:.62;}
/* THE LOADING SCREEN, over the first slide only. POINTER-EVENTS:NONE FROM THE
   FIRST FRAME, and it never changes: there is nothing on it to tap, and a
   decorative layer that could take a tap would sit over the game eating every
   touch if the hide below ever failed.
   FIRST IN THE BODY, and that is the whole of why it works. The pod.js tag
   below is a render-blocking classic script fetched from ANOTHER ORIGIN: the
   parser stops at it until the API answers, so anything after it does not exist
   yet. Measured on the live page 2026-09-06 with this div placed after the tag
   -- at 250ms mb-splash was not in the DOM at all.
   NO BACKTICKS IN HERE: this comment sits inside a template literal. */
#mb-splash{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1;
  pointer-events:none;background:#0f0f10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;opacity:1;
  transition:opacity .32s ease;}
#mb-splash.mb-gone{opacity:0;}
/* A LIGHT BEHIND THE MARK, breathing. It is one radial gradient on a pseudo
   element rather than a box-shadow on the logo: a shadow that size repaints the
   mark every frame, a scaled gradient is composited. */
#mb-splash:before{content:"";position:absolute;z-index:1;width:min(70vmin,420px);
  height:min(70vmin,420px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,90,24,.34),rgba(255,90,24,0) 68%);
  animation:mb-breathe 3.4s ease-in-out infinite;}
/* THE GAME'S OWN FACE, and the house mark under it.
 *
 * Every game's loading screen was the same screen: our mark, the game's name,
 * and five blocks on one orange. The name was the only per-game thing on it.
 *
 * /icon.webp is the game's own 256px mark, written by the publish and served
 * FROM THIS ORIGIN -- so img-src 'self' already admits it and no policy has
 * to widen. It is drawn twice from one fetch: sharp at 84px as the subject, and
 * blown up and blurred behind everything as the ground, which is what gives
 * each game its own colour without a colour ever being computed or stored.
 *
 * 256px AND NOT card.webp. The card is 1000x1000 and the share image 1200x675;
 * either would be a few hundred KB racing the game's own boot for bandwidth on
 * the one screen that exists because the game has not booted. The icon is the
 * smallest of the three, it is the right size for 84 CSS px at 3x, and blur
 * makes its resolution irrelevant to the half of the job that scales it up.
 *
 * IT IS NOT IN THE FIRST FRAME AND DOES NOT NEED TO BE. The ground, the name
 * and the blocks paint with zero network exactly as before; the art fades in
 * behind them when it arrives. A game whose icon 404s -- anything published
 * before the publish made one -- shows what it shows today, minus a mark that
 * has moved to the corner. */
#mb-art{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;
  object-fit:cover;opacity:0;transition:opacity .5s ease;
  transform:scale(1.25);filter:blur(38px) saturate(1.5) brightness(.52);}
#mb-art.mb-on{opacity:1;}
/* THE HOUSE GLOW STANDS DOWN WHEN THE GAME HAS ITS OWN. It exists to give a
   flat ground something to do; over the game's own colours it is one orange
   wash making every game look a little more like every other, which is the
   thing this screen was changed to stop. */
#mb-splash.mb-lit:before{opacity:0;}
#mb-face{width:84px;height:84px;display:block;position:relative;z-index:2;
  border-radius:18px;opacity:0;transition:opacity .4s ease;
  box-shadow:0 12px 34px rgba(0,0,0,.5);
  animation:mb-float 3.4s ease-in-out infinite;}
#mb-face.mb-on{opacity:1;}
/* GONE, NOT EMPTY, when there is no icon: an 84px hole above the name is worse
   than a name on its own. */
#mb-face.mb-no{display:none;}
/* THE HOUSE MARK, under the game's. It was the 84px subject of this screen and
   the game is the subject now -- this is the publisher's mark on a title card,
   which is where it belongs when the card finally has a title. */
#mb-mark{position:absolute;bottom:26px;left:50%;width:26px;height:26px;
  margin-left:-13px;display:block;z-index:2;opacity:.5;}
#mb-splash p{margin:0;position:relative;z-index:2;
  text-shadow:0 2px 14px rgba(0,0,0,.7);
  font:700 20px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;
  letter-spacing:.01em;color:#fff1cf;max-width:76vw;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* THE BLOCKS ARE THE POINT. Five of them, rising in sequence and settling --
   a thing being BUILT, which is what the wait actually is, and it rhymes with
   the voxel worlds most of these games are made of.
   TRANSFORM AND OPACITY ONLY: this sits over a frame that is booting a 3D
   engine, and anything that forces layout here is stolen from that. */
#mb-blocks{display:flex;gap:7px;position:relative;z-index:2;height:14px;align-items:flex-end;}
#mb-blocks i{width:14px;height:14px;border-radius:3px;display:block;
  transform:translateY(6px) scale(.7);opacity:.25;
  animation:mb-build 1.5s cubic-bezier(.22,.8,.28,1) infinite;}
#mb-blocks i:nth-child(1){background:#ff5a18;animation-delay:0s;}
#mb-blocks i:nth-child(2){background:#ffd229;animation-delay:.12s;}
#mb-blocks i:nth-child(3){background:#fff1cf;animation-delay:.24s;}
#mb-blocks i:nth-child(4){background:#3fe6ff;animation-delay:.36s;}
#mb-blocks i:nth-child(5){background:#d62817;animation-delay:.48s;}
@keyframes mb-build{
  0%,64%,100%{transform:translateY(6px) scale(.7);opacity:.25}
  22%,42%{transform:translateY(-6px) scale(1);opacity:1}}
@keyframes mb-float{
  0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes mb-breathe{
  0%,100%{transform:scale(.86);opacity:.55}50%{transform:scale(1.06);opacity:.9}}
/* STILL, NOT BLANK. Everything above is decoration on a wait; with motion
   turned down the wait still has to look like one, so the blocks stay in their
   settled state rather than disappearing. */
@media (prefers-reduced-motion:reduce){
  #mb-splash{transition:none}
  #mb-splash:before,#mb-face{animation:none}
  #mb-blocks i{animation:none;transform:none;opacity:1}
  #mb-feed{scroll-behavior:auto}
}
</style>

.mb-cookie-actions { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
.mb-cookie-actions button {
  flex:1; min-height:44px; padding:10px 14px; border:1px solid #bbb;
  border-radius:8px; background:#29292d; color:#fff; font:600 14px/1.4 system-ui,sans-serif; cursor:pointer;
}
.mb-cookie-actions button:disabled { opacity:.5; cursor:not-allowed; }
.mb-cookie-actions button:focus-visible, .mb-cookie-notice a:focus-visible,
.mb-cookie-accept:focus-visible { outline:3px solid #ff9366; outline-offset:3px; }
.mb-cookie-accept {
  flex:none; width:28px; height:28px; padding:0; border:0; border-radius:50%;
  background:#ff5a1f; color:#fff; font:700 14px/28px system-ui,sans-serif; cursor:pointer;
}
.mb-cookie-accept:hover { background:#ff7d45; }
.mb-cookie-page { max-width:600px; margin:48px auto; padding:24px; border-radius:16px; }
.mb-cookie-page h1 { font-size:22px; line-height:1.3; margin:0 0 14px; }
.mb-cookie-dialog {
  width:min(440px,calc(100% - 24px)); height:min(500px,calc(100dvh - 24px));
  padding:0; border:1px solid #666; border-radius:16px; background:#0f0f10;
  color:#fff; overflow:hidden; box-sizing:border-box;
}
.mb-cookie-dialog::backdrop { background:#0009; }
.mb-cookie-dialog iframe { width:100%; height:100%; border:0; }
.mb-cookie-close {
  position:absolute; top:8px; right:8px; width:36px; height:36px;
  border:1px solid #666; border-radius:8px; background:#29292d; color:#fff;
  font:24px/1 system-ui,sans-serif; cursor:pointer;
}
/* ABOVE THE RAIL. At rail.css's own breakpoint the rail is a bar along the
 * foot, and its plus button stands 62px up from the edge. */
@media (max-width:860px) and (orientation:portrait) {
  .mb-cookie-notice { bottom:calc(70px + env(safe-area-inset-bottom)); }
}
@media print { .mb-cookie-notice { display:none; } }
</style></head>

<script>
/* NO BACKTICKS IN HERE EITHER: this script is inside the same template literal
   the CSS above is in, and one in a comment ends the literal. The CSS block
   carries this warning and this one did not, so the next person to explain
   something in here reached for a code quote and the whole worker stopped
   parsing -- "Unexpected identifier 'load'", nowhere near the line. */
(function(){
  var splash = document.getElementById('mb-splash');
  /* THE GAME'S OWN FACE, once it has arrived.
   *
   * Both images are the SAME URL and therefore one fetch -- the browser serves
   * the second from the first's response. They are revealed together so the
   * blurred ground and the sharp mark never appear a frame apart.
   *
   * A LISTENER CAN BE TOO LATE. A 256px same-origin PNG can be in the cache and
   * complete before this script runs, and "load" does not fire again for an
   * image that has already finished -- so .complete is checked first, and the
   * listener is only for the case where it has not. Without that a warm cache
   * showed the plainest splash of all.
   *
   * ON ERROR IT IS TODAY'S SCREEN. A game published before the publish wrote an
   * icon 404s here, and what is left is the name, the blocks and our mark. */
  function dressUp() {
    var art = document.getElementById('mb-art');
    var face = document.getElementById('mb-face');
    if (!art || !face) return;
    function show() {
      art.className = 'mb-on';
      face.className = 'mb-on';
      if (splash) splash.className = 'mb-lit';
    }
    function drop() { face.className = 'mb-no'; }
    if (face.complete) { (face.naturalWidth ? show : drop)(); return; }
    face.addEventListener('load', show);
    face.addEventListener('error', drop);
    art.addEventListener('error', drop);
  }
  dressUp();
  function hideSplash() {
    if (!splash || splash.className.indexOf('mb-gone') >= 0) return;
    var wait = Math.max(0, 450 - (Date.now() - shown));
    setTimeout(function(){
      // KEPT, NOT REPLACED: mb-lit is what holds the house glow down, and
      // dropping it here made the orange bloom back in over the game's own
      // colours for the 320ms of the fade.
      splash.className = splash.className ? splash.className + ' mb-gone' : 'mb-gone';
      // OUT OF THE LAYOUT ONCE IT HAS FADED. An opacity of zero is still a
      // layer, and this one is over the game.
      setTimeout(function(){ splash.style.display = 'none'; }, 400);
    }, wait);
  }
  var shown = Date.now();
  // A DOCUMENT'S LOAD EVENT WAITS FOR ITS CHILD FRAMES, so this is the shell
  // being told the first game finished -- no reaching into the frame, and no
  // race with a listener attached after the frame already loaded.
  if (document.readyState === 'complete') hideSplash();
  else window.addEventListener('load', hideSplash);
  // And the failsafe, which is the whole reason this is safe to ship: a game
  // that never finishes loading must not leave somebody looking at a logo.
  setTimeout(hideSplash, 8000);

  // ---- there is no shelf under this game ---------------------------------
  //
  // IT WAS A REEL (Sasun, 2026-09-15: "feed games should not be fetched dude",
  // and on the scrolling: "Am I not clear that it should be disabled?").
  //
  // The page the link named was the first slide of a scroll snapping shelf, so
  // a two finger scroll -- which on a laptop is how somebody PLAYS -- snapped
  // to the next one and mounted a whole second game: its bundle, its fonts,
  // its models, its WebGL context. Measured on sky-to-city, 2026-09-15: one
  // wheel gesture and the frame was apex-city. Preloading had already been cut
  // to zero for the same complaint on 2026-09-13; the shelf itself was the
  // thing to remove, not its eagerness.
  //
  // The feed is not fetched here at all now, and no frame but the one above is
  // ever built. The ways onward are the rail's own arrows and the sheet at the
  // end of a run: both a deliberate reach, neither something a hand is already
  // doing while playing.
})();
</script>
